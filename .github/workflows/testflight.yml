name: TestFlight

# Sube una build a TestFlight (iOS y macOS) con firma automática.
# Se lanza a mà (Actions → TestFlight → Run workflow) o en crear una etiqueta "v*" (p. ex. v0.2.0).
# Necessita aquests secrets al repositori (veure docs/TESTFLIGHT.md):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contingut del fitxer .p8) i TEAM_ID.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Què pujar"
        type: choice
        options: [totes, ios, macos]
        default: totes
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
  TEAM_ID: ${{ secrets.TEAM_ID }}

jobs:
  ios:
    if: github.event_name == 'push' || inputs.plataforma != 'macos'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Comprova els secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v (veure docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - name: Instal·la XcodeGen
        run: brew install xcodegen
      - name: Prepara la clau d'App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Versió i número de build
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "VERSIO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSIO=" >> "$GITHUB_ENV"; fi
      - name: Genera el projecte
        run: xcodegen generate
      - name: Arxiva (iOS)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Mariapp.xcodeproj -scheme Mariapp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mariapp-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipMacroValidation -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${VERSIO:+MARKETING_VERSION="$VERSIO"} | tee archive-ios.log | tail -n 40
      - name: Opcions d'exportació
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Puja a TestFlight (iOS)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mariapp-iOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-ios" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Esborra la clau
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  macos:
    if: github.event_name == 'push' || inputs.plataforma != 'ios'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Comprova els secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secret $v (veure docs/TESTFLIGHT.md)"; exit 1; fi
          done
      - name: Instal·la XcodeGen
        run: brew install xcodegen
      - name: Prepara la clau d'App Store Connect
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Versió i número de build
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "VERSIO=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSIO=" >> "$GITHUB_ENV"; fi
      - name: Genera el projecte
        run: xcodegen generate
      - name: Arxiva (macOS)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Mariapp.xcodeproj -scheme Mariapp -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Mariapp-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipMacroValidation -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${VERSIO:+MARKETING_VERSION="$VERSIO"} | tee archive-macos.log | tail -n 40
      - name: Opcions d'exportació
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
      - name: Puja a TestFlight (macOS)
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mariapp-macOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export-macos" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Esborra la clau
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
